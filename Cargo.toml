[package]
name = "anduril_lattice_sdk"
version = "2.0.0"
edition = "2021"
description = "HTTP clients for the Anduril Lattice SDK"
license-file = "LICENSE"
repository = "https://github.com/anduril/lattice-sdk-rust"
documentation = "https://docs.rs/anduril_lattice_sdk"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
pin-project = { version = "1.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
reqwest-sse = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["sse"]
sse = ["reqwest-sse", "pin-project"]
